# ==============================================================================================
# /**
#  * @file        application.yml
#  * @module      Thinklab Platform Gateway Service Core Configuration
#  * @description Centralized configuration manifest for the Micronaut 4.x runtime.
#  *              Orchestrates application identity, Netty reactive engine, OpenAPI/Swagger
#  *              documentation, health/metrics telemetry, and high-performance database
#  *              connection pooling. Adheres to cloud-native and 12-factor app principles.
#  *
#  * @architecture ADR-011: Zero-Trust Resilient Telemetry (Framework-agnostic)
#  *
#  * @maintainer  Thinklab Systems Engineering Team
#  * @target      Production-grade practices (home-lab portfolio project)
#  */
# ==============================================================================================

micronaut:
  application:
    name: thinklab-platform-gateway-service
    instance:
      id: ${random.shortuuid}


  # ----------------------------------------------------------------------------------------------
  # /**
  #  * @subsection  Netty HTTP Server & Reactive Engine
  #  * @description Optimized for non-blocking I/O (Project Reactor) and container limits.
  #  *              Includes graceful shutdown and aggressive connection recycling.
  #  */
  # ----------------------------------------------------------------------------------------------
  http:
    services:
      gateway-upstream:
        # This is the ONLY client the gateway uses to call upstream services (UpstreamProxy).
        # It is deliberately kept separate from the default client config so its timeout maps
        # 1:1 to ERR-GTW-00504; a client used to call the gateway itself (or in tests) must not
        # share this timeout.
        read-timeout: ${GATEWAY_UPSTREAM_READ_TIMEOUT:15s}
        connect-timeout: ${GATEWAY_UPSTREAM_CONNECT_TIMEOUT:3s}
        # A proxy relays a redirect, it never follows one: following it would send the gateway to wherever the upstream points (an
        # identity provider, in the federation sign-in) and hand the browser that site's answer instead of the redirect.
        follow-redirects: false
      gateway-billing:
        # subscription-billing-service, asked whether a plan includes a feature (EntitlementGate). Fail-open, so short timeouts.
        url: ${GATEWAY_BILLING_URL:`http://localhost:8095`}
        read-timeout: 2s
        connect-timeout: 1s
      gateway-audit:
        # The compliance ledger the gateway appends to (AuditRecorder). Short timeouts: the append is fire-and-forget
        # and fail-open, so a slow ledger should be abandoned quickly, not held open.
        url: ${GATEWAY_AUDIT_LEDGER_URL:`http://localhost:8094`}
        read-timeout: 2s
        connect-timeout: 1s
  server:
    port: ${MICRONAUT_SERVER_PORT:8088}
    cors:
      enabled: true
    idle-timeout: 60s
    netty:
      max-header-size: 8192
      worker:
        threads: ${NETTY_WORKER_THREADS:0}
      shutdown-quiet-period: 2s
      shutdown-timeout: 10s

  # ----------------------------------------------------------------------------------------------
  # /**
  #  * @subsection  Serialization Engine (Micronaut Serde)
  #  * @description Reflection-free AOT JSON serialization settings.
  #  */
  # ----------------------------------------------------------------------------------------------
  serde:
    write-dates-as-timestamps: false
    deserialization:
      ignore-unknown: true
    serialization:
      inclusion: NON_NULL

  # ----------------------------------------------------------------------------------------------
  # /**
  #  * @subsection  OpenAPI / Swagger Routing
  #  * @description Maps static classpath resources generated by the AOT compilation phase.
  #  */
  # ----------------------------------------------------------------------------------------------
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

# ----------------------------------------------------------------------------------------------
# /**
#  * @section     Management Endpoints & Observability
#  * @description Exposes structural application telemetry and dynamic management interfaces.
#  *              All endpoints are blocked at the Ingress level for public traffic.
#  */
# ----------------------------------------------------------------------------------------------
endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
    kubernetes:
      enabled: true
  metrics:
    enabled: true
    sensitive: false
  prometheus:
    enabled: true
    sensitive: false
  loggers:
    enabled: true
    sensitive: false
  info:
    enabled: true
    sensitive: false


# ----------------------------------------------------------------------------------------------
# Gateway (ADR-022): the single public entry point. Requests are routed by their first path segment
# (the BIAN Service Domain) to the upstream below. Upstreams are trusted internal services; the
# gateway authenticates and rate-limits at the edge and each upstream verifies the token again.
# ----------------------------------------------------------------------------------------------
gateway:
  routes:
    party-authentication: ${GATEWAY_PARTY_AUTHENTICATION_URL:`http://localhost:8082`}
    party-reference-data-directory: ${GATEWAY_PARTY_REFERENCE_URL:`http://localhost:8081`}
    it-asset-registry: ${GATEWAY_IT_ASSET_URL:`http://localhost:8083`}
    it-operation-window: ${GATEWAY_IT_OPERATION_WINDOW_URL:`http://localhost:8084`}
    it-hardware-maintenance: ${GATEWAY_IT_HARDWARE_MAINTENANCE_URL:`http://localhost:8085`}
    site-reference-data-directory: ${GATEWAY_SITE_REFERENCE_URL:`http://localhost:8087`}
    notification-dispatch: ${GATEWAY_NOTIFICATION_DISPATCH_URL:`http://localhost:8089`}
    workflow-approval: ${GATEWAY_WORKFLOW_APPROVAL_URL:`http://localhost:8090`}
    it-change-management: ${GATEWAY_IT_CHANGE_MANAGEMENT_URL:`http://localhost:8086`}
    it-discovery: ${GATEWAY_IT_DISCOVERY_URL:`http://localhost:8091`}
    it-topology-graph: ${GATEWAY_IT_TOPOLOGY_GRAPH_URL:`http://localhost:8092`}
    ci-type-catalog: ${GATEWAY_CI_TYPE_CATALOG_URL:`http://localhost:8093`}
    compliance-audit-ledger: ${GATEWAY_COMPLIANCE_AUDIT_LEDGER_URL:`http://localhost:8094`}
    subscription-billing: ${GATEWAY_SUBSCRIPTION_BILLING_URL:`http://localhost:8095`}
    consumable-inventory: ${GATEWAY_CONSUMABLE_INVENTORY_URL:`http://localhost:8096`}
    identity-federation: ${GATEWAY_IDENTITY_FEDERATION_URL:`http://localhost:8097`}
    it-incident-management: ${GATEWAY_IT_INCIDENT_MANAGEMENT_URL:`http://localhost:8098`}
    it-service-request: ${GATEWAY_IT_SERVICE_REQUEST_URL:`http://localhost:8099`}
    it-problem-management: ${GATEWAY_IT_PROBLEM_MANAGEMENT_URL:`http://localhost:8100`}
    it-knowledge-base: ${GATEWAY_IT_KNOWLEDGE_BASE_URL:`http://localhost:8101`}
    it-external-ticketing: ${GATEWAY_IT_EXTERNAL_TICKETING_URL:`http://localhost:8102`}
    it-health-monitoring: ${GATEWAY_IT_HEALTH_MONITORING_URL:`http://localhost:8103`}
  # ADR-032 of the ledger service: record every mutating request that carries a tenant on the compliance ledger.
  # Off by default; asynchronous and fail-open (a ledger outage never affects the request).
  audit:
    enabled: ${GATEWAY_AUDIT_ENABLED:false}
    # Secret for pseudonymising the sign-in email before it reaches the ledger (HMAC-SHA256, ADR-024). Empty = recorded as
    # login:unkeyed (the attempt and its outcome, but no per-person correlation). Never a plain hash of the email.
    pseudonym-key: ${GATEWAY_AUDIT_PSEUDONYM_KEY:}
  # ADR-027: the pseudonym lookup an administrator runs to find what a KNOWN person did. Off by default (the endpoint then answers 404);
  # ADMIN only when security is on; recorded on the ledger before anything is disclosed.
  investigation:
    enabled: ${GATEWAY_INVESTIGATION_ENABLED:false}
    max-per-hour: ${GATEWAY_INVESTIGATION_MAX_PER_HOUR:20}
  # ADR-026: turn away a request for a feature the tenant plan does not include (403). Off by default; fail-open when billing is unreachable.
  entitlements:
    enabled: ${GATEWAY_ENTITLEMENTS_ENABLED:false}
    cache-ttl: ${GATEWAY_ENTITLEMENTS_CACHE_TTL:30s}
    features:
      it-discovery: discovery
      compliance-audit-ledger: audit
      identity-federation: sso
  request-timeout: 15s
  # Internal-only endpoints are never reachable through the gateway (they answer 404).
  denied-paths:
    - /party-authentication/v1/token
    - /party-authentication/v1/session/revoked
    - /party-authentication/v1/session/federated
  max-body-bytes: 1048576
  # The refresh token lives in this HttpOnly cookie, never in page scripts (ADR-025). path is as the BROWSER sees it (behind the web app's /api
  # prefix); secure is turned off only for plain-http local development. complete-url/login-url are where the browser lands after a
  # federated sign-in (success / failure), on the web app.
  session-cookie:
    name: ${GATEWAY_SESSION_COOKIE_NAME:thinklab_rt}
    path: ${GATEWAY_SESSION_COOKIE_PATH:/api/gateway/v1/session}
    secure: ${GATEWAY_SESSION_COOKIE_SECURE:true}
    complete-url: ${GATEWAY_SSO_COMPLETE_URL:/sso/complete}
    login-url: ${GATEWAY_SSO_LOGIN_URL:/login}
  rate-limit:
    requests-per-second: ${GATEWAY_RATE_LIMIT_RPS:50}
    burst: ${GATEWAY_RATE_LIMIT_BURST:100}

# Readiness of the gateway includes its upstreams (kit ExternalEndpointsHealthIndicator).
warmup:
  endpoints:
    party-authentication: ${GATEWAY_PARTY_AUTHENTICATION_URL:`http://localhost:8082`}/health/liveness

# ----------------------------------------------------------------------------------------------
# Platform security (ADR-020, ADR-021). The gateway only VERIFIES tokens (public keys from the issuer
# JWKS) and polls the issuer for revoked sessions. Login, refresh and the JWKS stay public.
# ----------------------------------------------------------------------------------------------
thinklab:
  security:
    enabled: ${THINKLAB_SECURITY_ENABLED:false}
    service-name: thinklab-platform-gateway-service
    jwks-url: ${THINKLAB_JWKS_URL:`http://localhost:8082/party-authentication/v1/.well-known/jwks.json`}
    revocation-url: ${THINKLAB_REVOCATION_URL:`http://localhost:8082/party-authentication/v1/session/revoked`}
    public-paths:
      - /health
      - /prometheus
      - /metrics
      - /swagger
      - /swagger-ui
      - /openapi
      - /party-authentication/v1/session/initiate
      - /party-authentication/v1/session/refresh
      - /party-authentication/v1/session/revoke
      - /party-authentication/v1/.well-known
      # Also on gateway.denied-paths: exempted here too so SecurityFilter lets the request reach
      # RouteTable, which then answers 404 regardless of whether a token was presented - the same
      # response an unknown domain gets, never a 401 that would hint the path exists.
      - /party-authentication/v1/token
      - /party-authentication/v1/session/revoked
      - /party-authentication/v1/session/federated
      # The gateway's own session endpoints (cookie bridge, ADR-025) authenticate with the refresh cookie, and the federation sign-in routes
      # are reached by a person who has no token yet.
      - /gateway/v1/session
      - /identity-federation/v1/login
      # The ServiceNow and Jira webhooks cannot sign in: the connector identifies the connection by its path and proves the caller by its own token (connector ADR-032).
      - /it-external-ticketing/v1/webhook
