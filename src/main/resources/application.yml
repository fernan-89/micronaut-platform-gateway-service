# ==============================================================================================
# /**
#  * @file        application.yml
#  * @module      Thinklab Platform Gateway Service Core Configuration
#  * @description Centralized configuration manifest for the Micronaut 4.x runtime.
#  *              Orchestrates application identity, Netty reactive engine, OpenAPI/Swagger
#  *              documentation, health/metrics telemetry, and high-performance database
#  *              connection pooling. Adheres to cloud-native and 12-factor app principles.
#  *
#  * @architecture ADR-011: Zero-Trust Resilient Telemetry (Framework-agnostic)
#  *
#  * @maintainer  Thinklab Systems Engineering Team
#  * @target      Production-grade practices (home-lab portfolio project)
#  */
# ==============================================================================================

micronaut:
  application:
    name: thinklab-platform-gateway-service
    instance:
      id: ${random.shortuuid}


  # ----------------------------------------------------------------------------------------------
  # /**
  #  * @subsection  Netty HTTP Server & Reactive Engine
  #  * @description Optimized for non-blocking I/O (Project Reactor) and container limits.
  #  *              Includes graceful shutdown and aggressive connection recycling.
  #  */
  # ----------------------------------------------------------------------------------------------
  http:
    services:
      gateway-upstream:
        # This is the ONLY client the gateway uses to call upstream services (UpstreamProxy).
        # It is deliberately kept separate from the default client config so its timeout maps
        # 1:1 to ERR-GTW-00504; a client used to call the gateway itself (or in tests) must not
        # share this timeout.
        read-timeout: ${GATEWAY_UPSTREAM_READ_TIMEOUT:15s}
        connect-timeout: ${GATEWAY_UPSTREAM_CONNECT_TIMEOUT:3s}
  server:
    port: ${MICRONAUT_SERVER_PORT:8088}
    cors:
      enabled: true
    idle-timeout: 60s
    netty:
      max-header-size: 8192
      worker:
        threads: ${NETTY_WORKER_THREADS:0}
      shutdown-quiet-period: 2s
      shutdown-timeout: 10s

  # ----------------------------------------------------------------------------------------------
  # /**
  #  * @subsection  Serialization Engine (Micronaut Serde)
  #  * @description Reflection-free AOT JSON serialization settings.
  #  */
  # ----------------------------------------------------------------------------------------------
  serde:
    write-dates-as-timestamps: false
    deserialization:
      ignore-unknown: true
    serialization:
      inclusion: NON_NULL

  # ----------------------------------------------------------------------------------------------
  # /**
  #  * @subsection  OpenAPI / Swagger Routing
  #  * @description Maps static classpath resources generated by the AOT compilation phase.
  #  */
  # ----------------------------------------------------------------------------------------------
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

# ----------------------------------------------------------------------------------------------
# /**
#  * @section     Management Endpoints & Observability
#  * @description Exposes structural application telemetry and dynamic management interfaces.
#  *              All endpoints are blocked at the Ingress level for public traffic.
#  */
# ----------------------------------------------------------------------------------------------
endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
    kubernetes:
      enabled: true
  metrics:
    enabled: true
    sensitive: false
  prometheus:
    enabled: true
    sensitive: false
  loggers:
    enabled: true
    sensitive: false
  info:
    enabled: true
    sensitive: false


# ----------------------------------------------------------------------------------------------
# Gateway (ADR-022): the single public entry point. Requests are routed by their first path segment
# (the BIAN Service Domain) to the upstream below. Upstreams are trusted internal services; the
# gateway authenticates and rate-limits at the edge and each upstream verifies the token again.
# ----------------------------------------------------------------------------------------------
gateway:
  routes:
    party-authentication: ${GATEWAY_PARTY_AUTHENTICATION_URL:`http://localhost:8082`}
    party-reference-data-directory: ${GATEWAY_PARTY_REFERENCE_URL:`http://localhost:8081`}
    it-asset-registry: ${GATEWAY_IT_ASSET_URL:`http://localhost:8083`}
    it-operation-window: ${GATEWAY_IT_OPERATION_WINDOW_URL:`http://localhost:8084`}
    it-hardware-maintenance: ${GATEWAY_IT_HARDWARE_MAINTENANCE_URL:`http://localhost:8085`}
    site-reference-data-directory: ${GATEWAY_SITE_REFERENCE_URL:`http://localhost:8087`}
    notification-dispatch: ${GATEWAY_NOTIFICATION_DISPATCH_URL:`http://localhost:8089`}
  request-timeout: 15s
  # Internal-only endpoints are never reachable through the gateway (they answer 404).
  denied-paths:
    - /party-authentication/v1/token
    - /party-authentication/v1/session/revoked
  max-body-bytes: 1048576
  rate-limit:
    requests-per-second: ${GATEWAY_RATE_LIMIT_RPS:50}
    burst: ${GATEWAY_RATE_LIMIT_BURST:100}

# Readiness of the gateway includes its upstreams (kit ExternalEndpointsHealthIndicator).
warmup:
  endpoints:
    party-authentication: ${GATEWAY_PARTY_AUTHENTICATION_URL:`http://localhost:8082`}/health/liveness

# ----------------------------------------------------------------------------------------------
# Platform security (ADR-020, ADR-021). The gateway only VERIFIES tokens (public keys from the issuer
# JWKS) and polls the issuer for revoked sessions. Login, refresh and the JWKS stay public.
# ----------------------------------------------------------------------------------------------
thinklab:
  security:
    enabled: ${THINKLAB_SECURITY_ENABLED:false}
    service-name: thinklab-platform-gateway-service
    jwks-url: ${THINKLAB_JWKS_URL:`http://localhost:8082/party-authentication/v1/.well-known/jwks.json`}
    revocation-url: ${THINKLAB_REVOCATION_URL:`http://localhost:8082/party-authentication/v1/session/revoked`}
    public-paths:
      - /health
      - /prometheus
      - /metrics
      - /swagger
      - /swagger-ui
      - /openapi
      - /party-authentication/v1/session/initiate
      - /party-authentication/v1/session/refresh
      - /party-authentication/v1/session/revoke
      - /party-authentication/v1/.well-known
      # Also on gateway.denied-paths: exempted here too so SecurityFilter lets the request reach
      # RouteTable, which then answers 404 regardless of whether a token was presented - the same
      # response an unknown domain gets, never a 401 that would hint the path exists.
      - /party-authentication/v1/token
      - /party-authentication/v1/session/revoked
